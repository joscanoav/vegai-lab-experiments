<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vega AI - Panel de Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-area"><h2>Vega AI</h2></div>
            <nav class="menu-lateral">
                <button onclick="nuevoChat()">+ Nuevo Chat</button>
            </nav>
        </aside>

        <main class="chat-area">
            <button class="hamburger-btn">☰</button>
            <header class="chat-header">
                <h3>Conversación Actual</h3>
            </header>

            <section class="mensajes-container" id="chat-box"></section>

            <footer class="input-area">
                <div class="mode-selector">
                    <button class="mode-btn active" onclick="setMode('chat', this)">Chat</button>
                    <button class="mode-btn" onclick="setMode('image', this)">Imagen</button>
                </div>
                
                <form class="chat-form" id="chat-form">
                    <input type="text" id="user-input" placeholder="Escribe tu mensaje..." required>
                    <button type="submit">Enviar</button>
                </form>
            </footer>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
